<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 258" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Développement full stack">
<defs>
<linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B21B6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
