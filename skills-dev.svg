<style>
.p{animation:pop .7s cubic-bezier(.2,.9,.3,1.3) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.h{fill:none;stroke:#EC4899;stroke-width:2;opacity:0;animation:halo 5s ease-in-out infinite}
@keyframes halo{0%,72%,100%{opacity:0}86%{opacity:.85}}
.d{fill:#F9A8D4;animation:blink 2.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.bar{animation:grow 1.2s ease-out both;transform-box:fill-box;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
