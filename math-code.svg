<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Mathématiques et informatique">
<defs><linearGradient id="x" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EC4899"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs>
<style>
.f{fill:#6D28D9;font-family:'Cambria Math','STIX Two Math','Times New Roman','DejaVu Serif',serif;font-style:italic;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.l{animation:show 6s ease-in-out infinite}
@keyframes show{0%{opacity:0}12%,88%{opacity:1}100%{opacity:0}}
.r{fill:none;stroke:#EC4899;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="20" y="20" width="400" height="240" rx="24" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="2"/>
<text x="46" y="56" font-size="16" font-weight="800" fill="#7E22CE" letter-spacing="1.4">MATHÉMATIQUES</text>
<text class="f" x="70" y="100" font-size="34" style="animation-delay:0s">∇f(θ)</text><text class="f" x="250" y="90" font-size="46" style="animation-delay:0.6s">Σ</text><text class="f" x="330" y="190" font-size="48" style="animation-delay:1.1s">∫</text><text class="f" x="90" y="195" font-size="36" style="animation-delay:1.6s">σ²</text><text class="f" x="190" y="235" font-size="28" style="animation-delay:2.1s">P(A|B)</text><text class="f" x="300" y="120" font-size="30" style="animation-delay:2.6s">λ</text>
<rect x="580" y="20" width="400" height="240" rx="24" fill="#2E1065"/>
<circle cx="610" cy="48" r="5" fill="#F472B6"/><circle cx="628" cy="48" r="5" fill="#C084FC"/><circle cx="646" cy="48" r="5" fill="#8B5CF6"/>
<text x="946" y="54" text-anchor="end" font-size="16" font-weight="800" fill="#D8B4FE" letter-spacing="1.4">INFORMATIQUE</text>
<text class="l" x="640.0" y="108" font-family="Consolas, Menlo, monospace" font-size="16" style="animation-delay:0.0s"><tspan fill="#F472B6">def</tspan><tspan fill="#E9D5FF"> train(model, data):</tspan></text><text class="l" x="673.6" y="138" font-family="Consolas, Menlo, monospace" font-size="16" style="animation-delay:0.5s"><tspan fill="#F472B6">loss</tspan><tspan fill="#E9D5FF"> = objective(model, data)</tspan></text><text class="l" x="673.6" y="168" font-family="Consolas, Menlo, monospace" font-size="16" style="animation-delay:1.0s"><tspan fill="#F472B6">grads</tspan><tspan fill="#E9D5FF"> = gradient(loss, model)</tspan></text><text class="l" x="673.6" y="198" font-family="Consolas, Menlo, monospace" font-size="16" style="animation-delay:1.5s"><tspan fill="#F472B6">model</tspan><tspan fill="#E9D5FF">.update(grads)</tspan></text><text class="l" x="673.6" y="228" font-family="Consolas, Menlo, monospace" font-size="16" style="animation-delay:2.0s"><tspan fill="#F472B6">return</tspan><tspan fill="#E9D5FF"> evaluate(model)</tspan></text>
<circle class="r" cx="500" cy="140" r="38"/>
<circle cx="500" cy="140" r="38" fill="url(#x)"/>
<text x="500" y="158" text-anchor="middle" font-size="52" font-weight="700" fill="#fff">×</text>
<text x="500" y="298" text-anchor="middle" font-size="19" font-weight="700" fill="#4C1D95">Rigueur mathématique et ingénierie logicielle pour des livrables solides</text>
</svg>