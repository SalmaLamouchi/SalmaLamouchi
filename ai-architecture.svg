<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Architecture d'un système agentique : requête, orchestration d'agents, outils MCP, RAG, LLM, réponse, sous MLOps" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bx" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B21B6"/><stop offset="1" stop-color="#A21CAF"/></linearGradient>
<linearGradient id="mo" x1="0" x2="1"><stop offset="0" stop-color="#4C1D95"/><stop offset=".5" stop-color="#C026D3"/><stop offset="1" stop-color="#4C1D95"/></linearGradient>
</defs>
<style>
.fl{fill:none;stroke:#A855F7;stroke-width:3;stroke-dasharray:3 9;stroke-linecap:round;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.sh{animation:sh 6s ease-in-out infinite;transform-box:fill-box}
@keyframes sh{0%,100%{opacity:.85}50%{opacity:1}}
.pu{animation:pu 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="998" height="378" rx="22" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="2"/>
<path class="fl" d="M180 160H250"/><path class="fl" d="M440 160C500 160 500 61 560 61"/><path class="fl" d="M440 160H560"/><path class="fl" d="M440 160C500 160 500 261 560 261"/><path class="fl" d="M780 61C810 61 810 160 830 160"/><path class="fl" d="M780 161H830"/><path class="fl" d="M780 261C810 261 810 160 830 160"/>
<rect x="30" y="125" width="150" height="70" rx="16" fill="#fff" stroke="#C084FC" stroke-width="2"/><text x="105.0" y="157.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#4C1D95">Requête</text><text x="105.0" y="177.0" text-anchor="middle" font-size="12.5" fill="#7E22CE">besoin utilisateur</text>
<g class="pu"><rect x="250" y="112" width="190" height="96" rx="16" fill="url(#bx)"/><text x="345.0" y="157.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#fff">Orchestration d'agents</text><text x="345.0" y="177.0" text-anchor="middle" font-size="12.5" fill="#F5D0FE">LangGraph, CrewAI, AutoGen</text></g>
<rect x="560" y="30" width="220" height="62" rx="16" fill="url(#bx)"/><text x="670.0" y="58.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#fff">Outils et actions</text><text x="670.0" y="78.0" text-anchor="middle" font-size="12.5" fill="#F5D0FE">MCP, APIs REST</text>
<rect x="560" y="130" width="220" height="62" rx="16" fill="url(#bx)"/><text x="670.0" y="158.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#fff">Connaissances</text><text x="670.0" y="178.0" text-anchor="middle" font-size="12.5" fill="#F5D0FE">RAG, pgvector, LangChain</text>
<rect x="560" y="230" width="220" height="62" rx="16" fill="url(#bx)"/><text x="670.0" y="258.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#fff">Modèles de langage</text><text x="670.0" y="278.0" text-anchor="middle" font-size="12.5" fill="#F5D0FE">LLM, prompting, fine-tuning</text>
<rect x="830" y="125" width="140" height="70" rx="16" fill="#fff" stroke="#C084FC" stroke-width="2"/><text x="900.0" y="157.0" text-anchor="middle" font-size="15.5" font-weight="700" fill="#4C1D95">Réponse</text><text x="900.0" y="177.0" text-anchor="middle" font-size="12.5" fill="#7E22CE">fiable et sourcée</text>
<rect class="sh" x="30" y="318" width="940" height="42" rx="21" fill="url(#mo)"/>
<text x="500" y="344" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">MLOps : Git, CI/CD, Docker, déploiement et suivi des modèles</text>
<circle r="7" fill="#EC4899"><animateMotion dur="6s" repeatCount="indefinite" path="M180 160H830"/></circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>